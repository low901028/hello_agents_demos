[package]
name = "hello_agents_demos"
version = "0.1.0"
edition = "2024"
description = "rust agent learn; hello agents; agent demos"

[dependencies]
axum = {version = "0.8", features = []}
tokio = { version = "1", features = ["macros", "rt-multi-thread", "rt"] }
serde_json = {version = "1"}
reqwest = { version = "0.13", features = ["json", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"
rand = "0.8"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
lazy_static = "1.5.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
serde_yaml = "0.9"
parking_lot = "0.12.5"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3"

#[unstable]
#script = true